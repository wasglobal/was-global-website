<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAS GLOBAL</title><style>body{margin:0;background:#07170f;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:28px}.spinner{width:42px;height:42px;border:4px solid #ffffff44;border-top-color:#fff;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spinner"></div><div>Loading WAS Global…</div></div><script>
(async()=>{try{const names=["v70-1.bin", "v70-2.bin", "v70-3.bin", "v70-4.bin", "v70-5.bin", "v70-6.bin", "v70-7.bin"];const bufs=await Promise.all(names.map(n=>fetch(n).then(r=>{if(!r.ok)throw new Error(n);return r.arrayBuffer()})));let total=bufs.reduce((s,b)=>s+b.byteLength,0),all=new Uint8Array(total),o=0;for(const b of bufs){all.set(new Uint8Array(b),o);o+=b.byteLength}const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([all]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>WAS Global</h2><p>The website could not finish loading. Please refresh the page.</p></div>';console.error(e)}})();
</script></body></html>
